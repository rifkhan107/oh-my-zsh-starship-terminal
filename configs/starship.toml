add_newline = true  # Inserts a blank line between shell prompts
command_timeout = 5000  # Change command timeout from 500 to 1000 ms
format = """$env_var $all"""  # Add custom formatting before other stuff

# Drop ugly default prompt characters
[character]
success_symbol = ""
error_symbol = ""

# ---

# Shows an icon depending on what distro it is running on
[env_var.STARSHIP_DISTRO]
format = '[$env_value](bold white) '
variable = "STARSHIP_DISTRO"
disabled = false

# Shows the current username
[env_var.USER]
format = '[$env_value](bold white) '
variable = "USER"
disabled = true

# Shows an icon depending on what device it is running on
[env_var.STARSHIP_DEVICE]
format = 'on [$env_value](bold yellow)'
variable = "STARSHIP_DEVICE"
disabled = false

# ---

# Shows the hostname
[hostname]
ssh_only = false
format = "[on $hostname](bold yellow) "
disabled = false

# Shows current directory
[directory]
truncation_length = 1
truncation_symbol = "…/"
home_symbol = "  ~ "
read_only_style = "197"
read_only = "  "
format = "at [$path]($style)[$read_only]($read_only_style) "

# Shows current git branch
[git_branch]
symbol = " "
format = "via [$symbol$branch]($style) "
# truncation_length = 4
truncation_symbol = "…/"
style = "bold green"

# Shows current git status
[git_status]
format = '[\($all_status$ahead_behind\)]($style) '
style = "bold green"
conflicted = "🏳"
up_to_date = " "
untracked = " "
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
stashed = " "
modified = " "
staged = '[++\($count\)](green)'
renamed = "󰑕 "
deleted = " "

# Shows kubernetes context and namespace
[kubernetes]
format = 'via [󱃾  $context\($namespace\)](bold purple) '
disabled = false

# ---

# Disable some modules that aren't needed anymore
[username]
format = "[  $user](bold white) "
disabled = false
show_always = true

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
style = 'bold Blue'
symbol = '󰸏 '
[aws.region_aliases]
ap-southeast-2 = 'au'
us-east-1 = 'va'
[aws.profile_aliases]
CompanyGroupFrobozzOnCallAccess = 'Frobozz'

[vagrant]
disabled = true

[docker_context]
format = 'via [🐋 $context](blue bold)'

[helm]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[ruby]
disabled = true

[terraform]
format = '[󱁢 $version $workspace]($style) '


[custom.ansible]
command = 'if ls *.yml 2> /dev/null | grep -iqE "^main\\.yml$|^site\\.yml$"; then echo "Ansible"; fi'
when = "ls *.yml 2> /dev/null"
description = "Displays the Ansible symbol when in a directory with main.yml or site.yml"
symbol = "󱂚 "
style = "bold green"
format = "[$symbol$output]($style) "
